name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  # Analysis and every test except the golden images: Linux is ten times
  # cheaper than macOS on a private repository.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test --exclude-tags golden

  # Does this push touch what the golden images draw? Decided on a cheap Linux
  # runner, so that no macOS runner starts when it doesn't.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.diff.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # a branch: everything since it left main; main itself: since the previous push
          # (or since its first commit when that push is unknown)
          if [ "$BRANCH" != "main" ]; then
            BEFORE=$(git merge-base origin/main HEAD 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          if git diff --name-only "$BEFORE" HEAD | grep -qE '^(lib/|test/ui/|test/flutter_test_config.dart|test/tolerant_comparator.dart|assets/|pubspec\.(yaml|lock)|\.github/workflows/)'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

  # Golden images (tag "golden", see dart_test.yaml): macOS, because the
  # reference images were generated on macOS and Linux rasterises text
  # differently. Pinned to macos-15 because macos-latest is a moving target.
  # Only on main, on a manual run, or when a push touches what they draw.
  goldens:
    needs: changes
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.ui == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test --tags golden
      - name: Upload golden failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # Signed with the debug key for now.
      - run: flutter build apk --release
      - name: Rename the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk LAFLEURMUSIC-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LAFLEURMUSIC-android.apk
          path: LAFLEURMUSIC-android.apk
          if-no-files-found: error

  # Proof of sound on Android (plan 1, task 3): mpv plays a local file and an
  # http stream with headers, survives a 403 and publishes the media session.
  # Then the end-to-end run against a fake Subsonic server (task 10).
  # The hosted runner (2 cores, 7 GB) was shut down when Gradle and the NDK
  # built while the emulator ran: disk is freed first, the app is built
  # before the emulator starts, and the emulator runs as light as possible.
  android-emulator:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:?}"
          df -h /
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # Build once before the emulator starts, so Gradle and the NDK don't compete
      # with it; the integration tests below then reuse the warm Gradle build.
      - name: Build the test APK before the emulator
        run: flutter build apk --debug -t integration_test/sound_proof_test.dart
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # a real phone size (the default device is 320×640 at 160 dpi)
          profile: pixel_6
          ram-size: 2048M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # sound proof, then the end-to-end runs against a fake Subsonic server:
          # first launch (plan 1), offline (plan 2), accounts (plans 3 to 5: Navidrome + Jellyfin + Plex)
          script: |
            flutter test integration_test/sound_proof_test.dart
            flutter test integration_test/app_test.dart
            flutter test integration_test/offline_test.dart
            flutter test integration_test/accounts_test.dart

  # Android 9 (API 28): storage still asks for the write permission at run time
  # (until API 29). The app must start without it (end-to-end run, nothing
  # granted), then the offline and accounts runs download with it granted up front
  # (`-g`, kept when `flutter test` reinstalls with `adb install -r`): a test cannot
  # answer the system dialog.
  android-emulator-28:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:?}"
          df -h /
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build the test APKs before the emulator
        run: |
          flutter build apk --debug -t integration_test/offline_test.dart
          cp build/app/outputs/flutter-apk/app-debug.apk offline-debug.apk
          flutter build apk --debug -t integration_test/accounts_test.dart
          cp build/app/outputs/flutter-apk/app-debug.apk accounts-debug.apk
          flutter build apk --debug -t integration_test/app_test.dart
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 2048M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            flutter test integration_test/app_test.dart
            adb install -r -t -g offline-debug.apk
            flutter test integration_test/offline_test.dart
            adb install -r -t -g accounts-debug.apk
            flutter test integration_test/accounts_test.dart

  # Contract with a real Navidrome (plan 1, task 10): a throw-away server whose
  # music folder is test/fixtures/, its admin created through the API, then
  # our Subsonic client is run against it.
  navidrome:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NAVIDROME_URL: http://localhost:4533
      NAVIDROME_USER: ci-admin
      NAVIDROME_PASSWORD: ci-throwaway-password
    steps:
      - uses: actions/checkout@v4
      - name: Start Navidrome on test/fixtures
        run: tool/navidrome-ci.sh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test test/sources/navidrome_contract_test.dart
      - name: Navidrome log
        if: failure()
        run: docker logs navidrome-ci

  # Contract with a real Jellyfin (plan 4, task 4): a throw-away server whose music library is
  # two tagged FLAC files made from our own test tone, its startup wizard (admin, library) done
  # through the API, then our Jellyfin client is run against it.
  jellyfin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JELLYFIN_URL: http://localhost:8096
      JELLYFIN_USER: ci-admin
      JELLYFIN_PASSWORD: ci-throwaway-password
    steps:
      - uses: actions/checkout@v4
      - name: Start Jellyfin on generated test tones
        run: tool/jellyfin-ci.sh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test test/sources/jellyfin_contract_test.dart
      - name: Jellyfin log
        if: failure()
        run: docker logs jellyfin-ci
