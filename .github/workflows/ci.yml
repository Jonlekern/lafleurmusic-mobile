name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  test:
    # macOS: the golden images were generated on macOS, and an exact pixel
    # comparison would fail on Linux because of text rasterisation differences.
    # Pinned to macos-15 because macos-latest is a moving target and would
    # silently change rendering under pixel-exact goldens.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test
      - name: Upload golden failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # Signed with the debug key for now.
      - run: flutter build apk --release
      - name: Rename the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk LAFLEURMUSIC-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LAFLEURMUSIC-android.apk
          path: LAFLEURMUSIC-android.apk
          if-no-files-found: error

  # Proof of sound on Android (plan 1, task 3): mpv plays a local file and an
  # http stream with headers, survives a 403 and publishes the media session.
  # Then the end-to-end run against a fake Subsonic server (task 10).
  # The hosted runner (2 cores, 7 GB) was shut down when Gradle and the NDK
  # built while the emulator ran: disk is freed first, the app is built
  # before the emulator starts, and the emulator runs as light as possible.
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:?}"
          df -h /
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # Build once before the emulator starts, so Gradle and the NDK don't compete
      # with it; the integration tests below then reuse the warm Gradle build.
      - name: Build the test APK before the emulator
        run: flutter build apk --debug -t integration_test/sound_proof_test.dart
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # sound proof, then the end-to-end run against a fake Subsonic server (task 10)
          script: |
            flutter test integration_test/sound_proof_test.dart
            flutter test integration_test/app_test.dart

  # Contract with a real Navidrome (plan 1, task 10): a throw-away server whose
  # music folder is test/fixtures/, its admin created through the API, then
  # our Subsonic client is run against it.
  navidrome:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NAVIDROME_URL: http://localhost:4533
      NAVIDROME_USER: ci-admin
      NAVIDROME_PASSWORD: ci-throwaway-password
    steps:
      - uses: actions/checkout@v4
      - name: Start Navidrome on test/fixtures
        run: tool/navidrome-ci.sh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test test/sources/navidrome_contract_test.dart
      - name: Navidrome log
        if: failure()
        run: docker logs navidrome-ci
