<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(Inter-Regular.otf);font-weight:400}
@font-face{font-family:Inter;src:url(Inter-Bold.otf);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:640px;background:#0D0D0D;font-family:Inter;color:#F2F2F2;position:relative;overflow:hidden}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(242,110,242,.38),rgba(242,110,242,0) 62%);right:-180px;top:-160px}
.glow2{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(242,110,242,.16),rgba(242,110,242,0) 65%);left:-200px;bottom:-300px}
.fl{position:absolute;left:70px;top:90px;width:120px;height:120px;background:url(fleur-tile.png) center/170px no-repeat;border-radius:28px}
.logo{position:absolute;left:70px;top:255px;width:440px}
.tag{position:absolute;left:72px;top:318px;font-size:30px;font-weight:700;line-height:1.25;width:520px}
.tag span{color:#F26EF2}
.sub{position:absolute;left:72px;top:418px;font-size:18px;color:#aaa;width:470px;line-height:1.5}
.pill{position:absolute;left:72px;top:518px;background:#F26EF2;color:#111;font-weight:700;border-radius:22px;padding:9px 18px;font-size:16px}
.ph{position:absolute;width:250px;border-radius:34px;border:8px solid #000;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 1px #2a2a2a}
.ph img{display:block;width:100%}
.p1{left:660px;top:120px;transform:rotate(-8deg)}
.p2{left:840px;top:60px;z-index:2;width:270px}
.p3{left:1050px;top:130px;transform:rotate(8deg)}
</style></head><body>
<div class="glow"></div><div class="glow2"></div>
<div class="fl"></div><img class="logo" src="logo-texte-grand.png">
<div class="tag">Your music, <span>iPod style</span>,<br>on your phone.</div>
<div class="sub">Plays from your own Navidrome or Subsonic server. Keeps albums on the phone for when there's no network.</div>
<div class="pill">Android &amp; iPhone · free</div>
<div class="ph p1"><img src="../../docs/release/screens/phone-1.png"></div><div class="ph p2"><img src="../../docs/release/screens/phone-3.png"></div><div class="ph p3"><img src="../../docs/release/screens/phone-9.png"></div>
</body></html>
