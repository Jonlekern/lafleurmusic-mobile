<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(Inter-Regular.otf);font-weight:400}
@font-face{font-family:Inter;src:url(Inter-Bold.otf);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:300px;background:#0D0D0D;font-family:Inter;color:#F2F2F2;display:flex;gap:20px;padding:24px}
.c{flex:1;background:#1A1A1A;border:1px solid #2a2a2a;border-radius:22px;padding:26px 24px;position:relative;overflow:hidden}
.c::after{content:"";position:absolute;right:-60px;top:-60px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(242,110,242,.25),rgba(242,110,242,0) 70%)}
.i{width:52px;height:52px;border-radius:14px;background:#F26EF2;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.i svg{width:28px;height:28px}
h3{font-size:22px;margin-bottom:10px}
p{font-size:15px;color:#aaa;line-height:1.45}
</style></head><body>
<div class="c"><div class="i"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg></div><h3>iPod style</h3><p>Menu, Now Playing, Up Next, equalizer, crossfade, equal volume.</p></div>
<div class="c"><div class="i"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round"><rect x="4" y="4" width="16" height="6" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/></svg></div><h3>Your server</h3><p>Navidrome and the whole Subsonic family. Custom headers per account.</p></div>
<div class="c"><div class="i"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></div><h3>Offline</h3><p>Real files on the phone. Pick the folder, even iCloud Drive.</p></div>
<div class="c"><div class="i"><svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></div><h3>Top 100</h3><p>Your favourites kept by themselves at home, on Wi-Fi.</p></div>
</body></html>
